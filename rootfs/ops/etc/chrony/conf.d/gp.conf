# ops-01 is the playground's time source. Queue time is nginx's timestamp on node-01 subtracted
# from a pod's clock on another node, and replay lag compares the primary's commit time with a
# replica's clock, so the nodes must agree to well under a millisecond. Synced independently to
# internet servers they drifted 10-20 ms apart, and the fleet's 10 ms queue check failed on skew.
allow 172.16.0.0/24
# Serve the nodes even before ops-01 itself has synced.
local stratum 10
