# Observers need no login: an anonymous viewer role, and the Growing Pains dashboard as home.
[server]
http_port = 3000
[auth.anonymous]
enabled = true
org_role = Viewer
[security]
allow_embedding = true
[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/growingpains.json
min_refresh_interval = 5s
[analytics]
reporting_enabled = false
check_for_updates = false
[paths]
provisioning = /etc/grafana/provisioning
data = /var/lib/grafana
logs = /var/log/grafana
