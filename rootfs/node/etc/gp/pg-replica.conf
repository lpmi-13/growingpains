# The replica's settings: the primary's db.medium settings, with its own data directory.
data_directory = '/var/lib/gp/pg-replica'
hba_file = '/etc/postgresql/18/main/pg_hba.conf'
ident_file = '/etc/postgresql/18/main/pg_ident.conf'
port = 5432
unix_socket_directories = '/var/run/postgresql'
include_dir = '/etc/postgresql/18/main/conf.d'
