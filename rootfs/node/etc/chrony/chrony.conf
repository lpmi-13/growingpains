# Every node follows ops-01 and nothing else, so cross-node timestamps agree to well under a
# millisecond: queue time subtracts nginx's timestamp on node-01 from a pod's clock on another
# node, and replay lag compares the primary's commit time with a replica's clock. See
# rootfs/ops/etc/chrony/conf.d/gp.conf. (systemd-timesyncd, tried first, left them 10 ms apart.)
server 172.16.0.10 iburst minpoll 2 maxpoll 5
# Step once at boot, then only slew, so a run never sees time jump.
makestep 0.1 3
driftfile /var/lib/chrony/chrony.drift
rtcsync
