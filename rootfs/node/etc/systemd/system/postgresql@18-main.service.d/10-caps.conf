# db.medium: the plan's 1.5 cores and 1.5 GiB. The storyline's database costs are fitted to a
# playground core, where one db.medium is a 65% quota, as the genesis API's unit is 40%
# (internal/twin.PlaygroundDBCores; docs/plan-deviations.md). Both caps can be raised live with
# systemctl set-property, which the database scale-up move uses (actions/pg-cap). Drop-ins apply
# in filename order, and set-property writes 50-CPUQuota.conf and 50-MemoryMax.conf, so this file
# must sort before them; named caps.conf it sorted after, and every daemon-reload undid a raise.
[Service]
CPUQuota=65%
CPUQuotaPeriodSec=10ms
MemoryMax=1536M
