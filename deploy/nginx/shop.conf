# The shop's front door on node-01. It stays a host service for the whole run, and every
# migration shifts traffic behind it. The architect rewrites only upstream.conf, through the
# allowlisted nginx-apply action, and reloads gracefully.

# Every request is logged as JSON to the agent's syslog listener, which computes the shape
# signals that need a view of the whole fleet: key repetition, anonymous share, the busiest
# client, writes per seller, and search behaviour. The X-GP-* headers come from the API.
log_format gp_json escape=json
  '{"t":$msec,"m":"$request_method","u":"$request_uri","s":$status,"rt":$request_time,'
  '"sid":"$cookie_gp_sid","key":"$http_x_api_key","tok":"$cookie_gp_lsn",'
  '"route":"$upstream_http_x_gp_route","seller":"$upstream_http_x_gp_seller",'
  '"results":"$upstream_http_x_gp_results","role":"$upstream_http_x_gp_role","up":"$upstream_addr"}';

include /etc/nginx/gp/upstream.conf;

server {
    listen 80 reuseport backlog=4096 default_server;
    server_name _;
    access_log syslog:server=127.0.0.1:5140,facility=local7,tag=gp,nohostname gp_json;
    client_max_body_size 8m;

    location = /nginx-status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/16;
        deny all;
    }

    location / {
        proxy_pass http://shop;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The API measures queue time as now minus this.
        proxy_set_header X-Request-Start "t=${msec}";
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        # Connection failures retry on another server; requests that reached a server never do.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_hide_header X-GP-Route;
        proxy_hide_header X-GP-Seller;
        proxy_hide_header X-GP-Results;
        proxy_hide_header X-GP-Role;
    }
}
