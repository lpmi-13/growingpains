# The cache: one Valkey pod, 256 MiB maxmemory, allkeys-lru, no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: shop
  labels: {app: valkey, growing-pains/move: cache}
spec:
  replicas: 1
  selector:
    matchLabels: {app: valkey}
  template:
    metadata:
      labels: {app: valkey}
    spec:
      nodeSelector: {kubernetes.io/hostname: "{{ .Node }}"}
      tolerations: [{key: growing-pains/data, operator: Exists, effect: NoSchedule}]
      enableServiceLinks: false
      containers:
        - name: valkey
          image: {{ .ValkeyImage }}
          imagePullPolicy: Never
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
          ports: [{containerPort: 6379, name: valkey}]
          resources:
            requests: {cpu: 250m, memory: 300Mi}
            limits: {cpu: 250m, memory: 320Mi}
          readinessProbe:
            exec: {command: ["valkey-cli", "ping"]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: shop
spec:
  selector: {app: valkey}
  ports: [{port: 6379, targetPort: valkey, name: valkey}]
