<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growing Pains</title>
<style>
:root {
  --bg: #f7f4ee; --panel: #fffdf9; --ink: #26221d; --muted: #6f675d; --line: #e4ddd2;
  --traffic: #2f6f9f; --pressure: #b5651d; --decision: #6b4fa0; --outcome: #2e7d4f; --accent: #c2562d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1d2024; --ink: #e8e4dc; --muted: #9a958c; --line: #2c3036;
    --traffic: #79b4e0; --pressure: #e3a15f; --decision: #b49ce6; --outcome: #7fcf9c; --accent: #ef8a5f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.5rem; padding: 1rem; border-bottom: 1px solid var(--line); }
h1 { font-size: 1.25rem; margin: 0; }
.tag { color: var(--muted); font-size: .9rem; }
.clock { font: 600 1.4rem/1 ui-monospace, monospace; }
form { display: flex; gap: .5rem; margin-left: auto; }
input { width: 7rem; padding: .35rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
button { padding: .35rem .9rem; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; padding: 1rem; max-width: 1400px; margin: auto; }
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } form { margin-left: 0; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .25rem 1rem 1rem; min-width: 0; }
h2 { font-size: 1rem; margin: .75rem 0; }
.note { padding: .55rem 0; border-top: 1px solid var(--line); }
.note:first-of-type { border-top: 0; }
.meta { font: .78rem ui-monospace, monospace; color: var(--muted); }
.kind { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-right: .4rem; }
.traffic .kind { color: var(--traffic); } .pressure .kind { color: var(--pressure); }
.decision .kind { color: var(--decision); } .outcome .kind { color: var(--outcome); }
pre { font: .8rem/1.45 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; margin: .5rem 0; padding: .75rem; background: var(--bg); border-radius: 8px; }
.empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Growing Pains</h1>
    <div class="tag">One tiny shop. The traffic decides how it grows.</div>
  </div>
  <div class="clock" id="clock" aria-live="polite">genesis</div>
  <form id="start">
    <input id="seed" inputmode="numeric" placeholder="seed (optional)" aria-label="Seed">
    <button id="go" type="submit">Start</button>
  </form>
</header>
<main>
  <section aria-labelledby="feed-h">
    <h2 id="feed-h">What the traffic made the system do</h2>
    <div id="feed"><p class="empty">Waiting for the first note. Before Start the shop runs at genesis traffic.</p></div>
  </section>
  <section aria-labelledby="records-h">
    <h2 id="records-h">Decision records</h2>
    <div id="records"><p class="empty">No moves yet.</p></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
function clock(s) {
  if (s < 0) return "genesis";
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return "t+" + String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
}
function render(snap) {
  $("clock").textContent = snap.clock;
  $("go").disabled = snap.started;
  const feed = $("feed");
  if (snap.notes && snap.notes.length) {
    feed.replaceChildren(...snap.notes.slice().reverse().map((n) => {
      const div = document.createElement("div");
      div.className = "note " + n.kind;
      const meta = document.createElement("div");
      meta.className = "meta";
      const kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = n.kind;
      meta.append(kind, clock(n.run_t));
      const text = document.createElement("div");
      text.textContent = n.text;
      div.append(meta, text);
      return div;
    }));
  }
  const records = $("records");
  if (snap.records && snap.records.length) {
    records.replaceChildren(...snap.records.slice().reverse().map((r) => {
      const pre = document.createElement("pre");
      pre.textContent = r.text;
      return pre;
    }));
  }
}
const es = new EventSource("events");
es.onmessage = (e) => render(JSON.parse(e.data));
$("start").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("go").disabled = true;
  const seed = $("seed").value.trim();
  const r = await fetch("start" + (seed ? "?seed=" + encodeURIComponent(seed) : ""), { method: "POST" });
  if (!r.ok) { $("go").disabled = false; alert(await r.text()); }
});
</script>
</body>
</html>
