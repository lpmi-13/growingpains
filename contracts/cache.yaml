name: cache
title: A cache for hot reads
class: architecture
family: read-pattern
answers: db-read
# Reads repeat, and most of the hot traffic is in sessions, which rules out the edge microcache.
shape:
  - "reads.repeat_ratio >= 0.6"
  - "reads.anonymous_share < 0.5"
preconditions:
  - "state.cache == false"
footprint:
  - {node: any, component: valkey, kind: valkey, cpu: 0.25, memory_mib: 300}
relief: "reads.repeat_ratio * db.read_cpu_ratio * state.db_cores * 0.9"
relief_unit: database cores
new_components: 1
steps:
  - name: deploy
    phase: expand
    action: kube.apply
    params: {manifest: valkey}
    wait_for: valkey_ready
    timeout: 90s
    says: "One Valkey pod: 256 MiB maxmemory, allkeys-lru, no persistence"
  - name: cache-10
    phase: migrate
    action: config.set
    params: {cache: {address: "${valkey_address}", read_pct: 10}}
    wait_for: config_converged
    hold: 15s
    timeout: 60s
  - name: cache-50
    phase: migrate
    action: config.set
    params: {cache: {read_pct: 50}}
    wait_for: config_converged
    hold: 15s
    timeout: 60s
  - name: cache-100
    phase: migrate
    action: config.set
    params: {cache: {read_pct: 100}}
    wait_for: config_converged
    hold: 15s
    timeout: 60s
    says: "Caching enabled for 10% → 50% → 100% of reads; detail keys 60 s ± 10%, deleted on write and again after the lag bound; listings 10 s; single-flight fills; 20 ms timeout, fail open"
verify:
  settle: 60s
  checks:
    - "cache.hit_ratio >= 0.5"
  scale_with_traffic: true
  target: "db.read_cpu_ratio"
  expect: "db.read_cpu_ratio * (1 - reads.repeat_ratio * 0.9)"
rollback:
  - name: cache-off
    action: config.set
    params: {cache: {read_pct: 0, address: ""}}
    wait_for: config_converged
    timeout: 60s
  - name: delete-valkey
    action: kube.delete
    params: {manifest: valkey}
    timeout: 60s
effects:
  cache: true
why: >-
  {{pct .reads.repeat_ratio}} of listing and product views repeat one from the last minute, so a cache removes
  reads instead of copying them. {{pct .reads.anonymous_share}} of those views are anonymous, too few for an edge cache.
rejected: "A cache lost: {{.reason}}."
