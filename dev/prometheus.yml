# Local stack. The playground's ops-01 config is deploy/prometheus/prometheus.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"], labels: {instance: legacy}}]
  - job_name: agent
    static_configs: [{targets: ["edge:9102"], labels: {node: node-01}}]
  - job_name: crowd
    static_configs: [{targets: ["crowd:9101"]}]
  - job_name: prober
    static_configs: [{targets: ["prober:9103"]}]
  - job_name: architect
    static_configs: [{targets: ["architect:7000"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
